upstream ai {
    server ai:8000;
}


server {
    listen 80;
    client_max_body_size 30M;

    location /admin {
        proxy_pass http://ai;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

    }

    location /staticfiles/ {
        alias /App/staticfiles/;
    }

    location /mediafiles/ {
        alias /App/mediafiles/;
    }

    location / {
        proxy_pass http://ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Важно для HTTPS и CSRF в Django
        proxy_redirect off;
    }

}
